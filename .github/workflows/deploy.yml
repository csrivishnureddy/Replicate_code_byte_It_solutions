name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/codebyte-it-solutions build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          NODE_ENV: production

      # Enables client-side routing on GitHub Pages (serves index.html for all unknown paths)
      - name: Copy index.html to 404.html
        run: cp artifacts/codebyte-it-solutions/dist/public/index.html artifacts/codebyte-it-solutions/dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/codebyte-it-solutions/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
